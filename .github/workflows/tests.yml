name: Simulator Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Define dummy environment variables so tests can run
    # without needing a real .env file or a video card
    env:
      SDL_VIDEODRIVER: dummy        # Very important for Pygame (to run headless without a graphical interface)
      HASH_SECRET_KEY: test_secret  # For V2X Security

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Speeds up package installation on subsequent runs

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock

    - name: Run Pytest
      run: |
        pytest test_simulator.py -v